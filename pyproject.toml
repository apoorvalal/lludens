[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lludens"
version = "0.1.0"
authors = [{ name = "Apoorva Lal", email = "lal.apoorva@gmail.com" }]
description = "lludens simulates economic games with LLMs via the llm package."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "llm>=0.31.1",
    "llm-anthropic>=0.25.1",
    "llm-gemini>=0.32",
    "llm-mistral>=0.15",
    "llm-openrouter>=0.6",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "numpy",
    "pandas>=2.3.3",
]

[project.urls]
Homepage = "https://github.com/apoorvalal/lludens"

[project.optional-dependencies]
sysone = [
    "llm>=0.36",
    "llm-openai-decisions @ git+https://github.com/simonw/llm-openai-decisions.git@4827324f5b55a5a4e8626b81518d48706d790a08",
    "llm-typesafe @ git+https://github.com/simonw/llm-typesafe.git@225932cfde461ee6e38ae2b612040c50c086db8c",
]
test = ["pytest>=8"]

[tool.setuptools.packages]
find = {include = ["lludens*", "repeated_pd_variations*"]}

[tool.setuptools.package-data]
repeated_pd_variations = ["README.md", "models.json"]
